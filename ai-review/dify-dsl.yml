app:
  description: AI 代码审核：输入 diff，输出 JSON 审核结论（verdict/findings）。审核规则内置于 LLM 节点系统提示词，在 Dify 中修改。
  icon: "\U0001F916"
  icon_background: "#FFEAD5"
  mode: workflow
  name: ai-code-review
  use_icon_as_answer_icon: false
kind: app
version: 0.1.5
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      enabled: false
  graph:
    edges:
      - data:
          isInIteration: false
          sourceType: start
          targetType: llm
        id: edge-start-llm
        source: node_start
        sourceHandle: source
        target: node_llm
        type: custom
        zIndex: 0
      - data:
          isInIteration: false
          sourceType: llm
          targetType: end
        id: edge-llm-end
        source: node_llm
        sourceHandle: source
        target: node_end
        type: custom
        zIndex: 0
    nodes:
      - data:
          desc: ''
          selected: false
          title: 开始
          type: start
          variables:
            - label: diff
              max_length: 200000
              options: []
              required: true
              type: paragraph
              variable: diff
        height: 116
        id: node_start
        position:
          x: 80
          y: 280
        positionAbsolute:
          x: 80
          y: 280
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      - data:
          context:
            enabled: false
            variable_selector: []
          desc: ''
          model:
            completion_params:
              temperature: 0
            mode: chat
            name: Doubao-Seed-2.1-turbo
            provider: langgenius/openai_api_compatible/openai_api_compatible
          prompt_template:
            - id: prompt-system
              role: system
              text: |
                你是资深代码审查员，依据以下规则审查代码 diff。

                ## 范围
                - 只审查 diff 涉及的文件与改动行，不评价未改动代码
                - 忽略: *.lock、dist/、vendor/、自动生成文件、二进制文件

                ## 审查维度
                - 安全: SQL/命令注入、XSS、越权访问、硬编码密钥、不安全的反序列化
                - 正确性: 空引用、边界条件、异常被静默吞掉、并发与事务问题
                - 资源: 连接/文件句柄未关闭、循环内重复创建重量级对象
                - 兼容性: 公共接口签名变更、配置格式不兼容改动

                ## 严重级别
                - blocker: 可能导致安全漏洞或数据损坏
                - major: 明确的逻辑缺陷，应当修复
                - minor: 建议修复
                - info: 风格建议

                ## 输出要求
                只输出一个 JSON 对象，禁止输出 JSON 以外的任何字符（包括 Markdown 代码块标记）：
                {"verdict": "pass|fail", "summary": "一句话总结", "findings": [{"file": "路径", "line": 行号, "severity": "blocker|major|minor|info", "message": "问题描述", "suggestion": "修复建议"}]}
                verdict 判定: 存在 blocker 或 major 即 fail；否则 pass。没有发现时 findings 为空数组。
                findings 元素的字段名必须精确使用: file, line, severity, message, suggestion，禁止使用其他字段名。
            - id: prompt-user
              role: user
              text: |
                请审查以下代码 diff，严格按照系统提示词中的输出要求输出 JSON，不要输出任何其他内容：
                {{#node_start.diff#}}
          selected: false
          title: LLM 审核
          type: llm
          variables: []
          vision:
            enabled: false
        height: 90
        id: node_llm
        position:
          x: 380
          y: 280
        positionAbsolute:
          x: 380
          y: 280
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      - data:
          desc: ''
          outputs:
            - value_selector:
                - node_llm
                - text
              variable: review
          selected: false
          title: 结束
          type: end
        height: 90
        id: node_end
        position:
          x: 700
          y: 280
        positionAbsolute:
          x: 700
          y: 280
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
  hash: ''
