app:
  description: AI 代码审核：输入 diff 与规则，输出 JSON 审核结论（verdict/findings）。规则由调用方传入（仓库 ai-review/rules.md），输出契约固定于 LLM 节点。
  icon: "\U0001F916"
  icon_background: "#FFEAD5"
  mode: workflow
  name: ai-code-review
  use_icon_as_answer_icon: false
kind: app
version: 0.1.5
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      enabled: false
  graph:
    edges:
      - data:
          isInIteration: false
          sourceType: start
          targetType: llm
        id: edge-start-llm
        source: node_start
        sourceHandle: source
        target: node_llm
        type: custom
        zIndex: 0
      - data:
          isInIteration: false
          sourceType: llm
          targetType: end
        id: edge-llm-end
        source: node_llm
        sourceHandle: source
        target: node_end
        type: custom
        zIndex: 0
    nodes:
      - data:
          desc: ''
          selected: false
          title: 开始
          type: start
          variables:
            - label: diff
              max_length: 200000
              options: []
              required: true
              type: paragraph
              variable: diff
            - label: rules
              max_length: 20000
              options: []
              required: false
              type: paragraph
              variable: rules
        height: 116
        id: node_start
        position:
          x: 80
          y: 280
        positionAbsolute:
          x: 80
          y: 280
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      - data:
          context:
            enabled: false
            variable_selector: []
          desc: ''
          model:
            completion_params:
              temperature: 0
            mode: chat
            name: Doubao-Seed-2.1-turbo
            provider: langgenius/openai_api_compatible/openai_api_compatible
          prompt_template:
            - id: prompt-system
              role: system
              text: |
                你是资深代码审查员。用户消息会提供待审查的代码 diff；本次审查适用的规则由变量 rules 提供，必须严格依据 rules 审查；rules 为空时依据你的专业判断补足。

                ## 输出要求（固定接口，勿改动）
                只输出一个 JSON 对象，禁止输出 JSON 以外的任何字符（包括 Markdown 代码块标记）：
                {"verdict": "pass|fail", "summary": "一句话总结", "findings": [{"file": "路径", "line": 行号, "severity": "blocker|major|minor|info", "message": "问题描述", "suggestion": "修复建议"}]}
                verdict 判定: 存在 blocker 或 major 即 fail；否则 pass。没有发现时 findings 为空数组。
                findings 元素的字段名必须精确使用: file, line, severity, message, suggestion，禁止使用其他字段名。

                ## 审查规则
                {{#node_start.rules#}}

                ## 输出要求
                只输出一个 JSON 对象，禁止输出 JSON 以外的任何字符（包括 Markdown 代码块标记）：
                {"verdict": "pass|fail", "summary": "一句话总结", "findings": [{"file": "路径", "line": 行号, "severity": "blocker|major|minor|info", "message": "问题描述", "suggestion": "修复建议"}]}
                verdict 判定: 存在 blocker 或 major 即 fail；否则 pass。没有发现时 findings 为空数组。
                findings 元素的字段名必须精确使用: file, line, severity, message, suggestion，禁止使用其他字段名。
            - id: prompt-user
              role: user
              text: |
                请审查以下代码 diff，严格按照系统提示词中的输出要求输出 JSON，不要输出任何其他内容：
                {{#node_start.diff#}}
          selected: false
          title: LLM 审核
          type: llm
          variables: []
          vision:
            enabled: false
        height: 90
        id: node_llm
        position:
          x: 380
          y: 280
        positionAbsolute:
          x: 380
          y: 280
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      - data:
          desc: ''
          outputs:
            - value_selector:
                - node_llm
                - text
              variable: review
          selected: false
          title: 结束
          type: end
        height: 90
        id: node_end
        position:
          x: 700
          y: 280
        positionAbsolute:
          x: 700
          y: 280
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
  hash: ''
